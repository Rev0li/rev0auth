<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script>
            (function () {
                /* Anti-flash : thème posé avant le rendu (data-theme lu par rv-tokens) */
                var saved = localStorage.getItem('rev0auth_color_scheme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var isDark = saved === 'dark' || (saved === null && prefersDark);
                document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
                localStorage.removeItem('rev0auth_theme'); /* ancien éditeur de thème, retiré */
            })();
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
